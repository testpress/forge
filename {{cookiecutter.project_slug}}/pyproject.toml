[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = ""
authors = [
    {name = "{{ cookiecutter.author_name  }}", email = "{{ cookiecutter.email }}"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core Django & dependencies
    "Django==5.2.16",
    "django-environ==0.14.0",
    "django-extensions==4.1",
    "django-model-utils==5.0.0",
    "django-widget-tweaks==1.5.1",
    "django-simple-history==3.12.0",
    "ipython==8.26.0",
    "django-safedelete==1.4.1",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.4",
    "gunicorn==26.0.0",
    {% if cookiecutter.use_channels == "y" %}
    # Optional Channels
    "channels==4.2.2",
    "channels-redis==4.2.1",
    "daphne==4.2.0",
    {% endif %}
    {% if cookiecutter.use_sentry == "y" %}
    # Optional Sentry
    "sentry-sdk==2.20.0",
    {% endif %}
    {% if cookiecutter.use_django_ninja == "y" %}
    # Optional API layer. django-ninja brings its own Pydantic dependency;
    # authentication reuses django.contrib.auth, so there is no JWT or
    # password-hashing library to add here.
    "django-ninja==1.6.2",
    "django-cors-headers==4.9.0",
    # The API's operations are async, so it is served over ASGI rather than
    # through the WSGI/gunicorn path the plain template uses.
    "uvicorn[standard]==0.52.1",
    {% endif %}
    {% if cookiecutter.use_celery == "y" %}
    # Optional background tasks
    "celery==5.6.3",
    {% endif %}
    {% if cookiecutter.use_celery == "y" or cookiecutter.use_channels == "y" %}
    # The redis client backs two different things - Celery's broker and
    # channels-redis's channel layer - so it is gated on either flag,
    # mirroring how docker-compose.yml gates the redis service. Without
    # the "or", a Channels-only project would still get redis pulled in
    # transitively by channels-redis, but unpinned.
    #
    # Held below 6.5 deliberately: kombu (Celery's transport) declares
    # `redis!=4.5.5,!=5.0.2,<6.5,>=4.5.2`, so anything newer is outside
    # the range Celery supports - and switching this to `celery[redis]`
    # would make the project fail to resolve outright. 6.4.0 is the
    # newest release inside that range. Revisit when kombu lifts the cap.
    "redis==6.4.0",
    {% endif %}
]

[project.optional-dependencies]
dev = [
    # Development & testing tools
    "coverage==7.6.1",
    "django-coverage-plugin==3.1.0",
    "django-debug-toolbar==7.0.0",
    "django-stubs==5.2.9",
    "mypy==1.11.1",
    "pre-commit==3.8.0",
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-django==4.8.0",
    "pytest-sugar==1.0.0",
    "ruff",
    "djlint",
    "pytest-mock==3.14.1",
    "factory-boy==3.3.3",
    "types-factory-boy==0.4.1",
    "faker==37.3.0",
    "pytest-xdist==3.7.0",
    "pytest-env==1.1.5",
    "pytest-asyncio==1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = """
--ds=config.test
--reuse-db
--nomigrations
--strict-markers
--disable-warnings
--tb=short
"""
plugins = [
  "pytest-cov",
  "pytest-django",
  "pytest-env",
  "pytest-asyncio"
]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
env = [
  "DB_NAME=test_lms_db",
]


# ==== Coverage ====
[tool.coverage.run]
include = ["{{cookiecutter.project_slug}}/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]


# ==== Ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "app/db/migrations/*.py",
    "app/static/*"
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.13
target-version = "py313"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TCH",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF"
]
ignore = [
  "UP038", # Checks for uses of isinstance/issubclass that take a tuple
           # of types for comparison.
           # Deactivated because it can make the code slow:
           # https://github.com/astral-sh/ruff/issues/7871
  "COM812" # Trailing comma handling is already owned by the formatter
           # (see [tool.ruff.format] below); keeping this rule selected
           # too causes the two to fight each other on every save.
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests routinely use bare asserts, inline literals like `== 200`, and
# literal passwords for the fixtures they create - that's expected pytest
# style, not a real security/readability issue.
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# django-ninja passes the request as the first argument to every operation
# even when the handler doesn't read it, so ARG001-style unused-argument
# complaints don't apply; B008 covers Query()/Path() argument defaults,
# which are idiomatic ninja rather than a mutable-default bug.
"app/api/**" = ["B008"]
# Deliberately commented-out example routing left for users to uncomment.
"config/asgi.py" = ["ERA001"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
force-single-line = true

# ==== mypy ====
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.local"
strict_settings = true

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2
