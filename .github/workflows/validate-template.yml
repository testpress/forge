name: Validate template

# Bakes this cookiecutter template with several flag combinations and runs
# the generated project's own quality gates against each one. This is what
# actually catches "works with these flags but not those" bugs - the
# per-project .github/workflows/ci.yml can only ever validate whichever
# single combination a given generated project was created with.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bake-and-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ""
          - name: django-ninja
            flags: "use_django_ninja=y"
          - name: channels
            flags: "use_channels=y"
          - name: sentry
            flags: "use_sentry=y"
          # Celery is the one flag that defaults to "y", so the
          # interesting case to cover is turning it off.
          - name: no-celery
            flags: "use_celery=n"
          # Two optional layers at once: the API must not conflict with
          # Channels' ASGI application, and both must survive without
          # Celery's models in the app registry.
          - name: ninja-channels-no-celery
            flags: "use_django_ninja=y use_channels=y use_celery=n"
          # use_preline swaps in extra Tailwind content sources and a
          # Preline-specific JS import (frontend/js/main.js) - the only
          # flag that changes the frontend build, so it needs its own
          # combination rather than relying on the default's "n".
          - name: preline
            flags: "use_preline=y"
    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: sqlite:///db.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
      SENTRY_DSN: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Bake project (${{ matrix.name }})
        run: uvx cookiecutter --no-input . project_name="Testproj" ${{ matrix.flags }}
        # post_gen_project.py already runs `uv sync`, ruff, and djlint
        # during generation - this step's exit code is the first signal
        # that baking itself (including that setup) didn't fail outright.

      - name: Ruff check
        working-directory: testproj
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: testproj
        run: uv run ruff format --check .

      - name: djLint
        working-directory: testproj
        run: uv run djlint . --check

      # The generated project's own ci.yml runs mypy as a blocking job, so
      # it has to be checked here too - otherwise a template change that
      # breaks type checking passes this workflow and only surfaces on the
      # first CI run of somebody's newly generated project. Run per flag
      # combination, because which files exist - and even what a list's
      # element type infers to - depends on the flags.
      - name: mypy
        working-directory: testproj
        run: uv run mypy .

      - name: Check for missing migrations
        working-directory: testproj
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: testproj
        run: uv run pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No package-lock.json is committed (it's generated fresh per
      # project), so this is a plain install rather than `npm ci`. Exercises
      # the Tailwind v4 / Vite build - and, on the preline combination, the
      # Preline-specific content sources and JS import - end to end.
      - name: Install frontend dependencies
        working-directory: testproj/frontend
        run: npm install

      - name: Build frontend assets
        working-directory: testproj/frontend
        run: npm run build

      - name: Docker build (production target)
        run: docker build -t testproj:ci testproj

      # Cheap correctness check for docker-compose.prod.yml, which is
      # Jinja-templated the same as docker-compose.yml: catches a broken
      # render (bad conditional, undefined var) per flag combination
      # without paying for a full stack boot on every combination - that
      # happens once, below, for the default combination.
      - name: Validate docker-compose.prod.yml renders
        working-directory: testproj
        run: POSTGRES_PASSWORD=ci-placeholder docker compose -f docker-compose.prod.yml config >/dev/null

  docker-compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Bake default project
        run: uvx cookiecutter --no-input . project_name="Testproj"

      - name: Start the compose stack
        working-directory: testproj
        run: docker compose up -d --build

      - name: Wait for web to come up
        working-directory: testproj
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/admin/login/ >/dev/null && exit 0
            sleep 2
          done
          echo "web never became reachable"
          docker compose logs
          exit 1

      - name: Dump logs on failure
        if: failure()
        working-directory: testproj
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: testproj
        run: docker compose down -v

  docker-compose-prod-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Bake default project
        run: uvx cookiecutter --no-input . project_name="Testproj"

      # docker-compose-smoke-test (above) only ever exercises config.local
      # (DEBUG=True), which never runs the production STORAGES/collectstatic
      # path - the actual runtime target for the production Dockerfile
      # stage, WhiteNoise, and docker-compose.prod.yml. This is a separate
      # job so the two can't quietly start reusing the same config by
      # accident.
      - name: Configure production .env
        working-directory: testproj
        run: |
          sed -i 's/^DEBUG=True/DEBUG=False/' .env
          echo "POSTGRES_PASSWORD=ci-placeholder" >> .env

      - name: Start the production compose stack
        working-directory: testproj
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for web to come up
        working-directory: testproj
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/admin/login/ >/dev/null && exit 0
            sleep 2
          done
          echo "web never became reachable"
          docker compose -f docker-compose.prod.yml logs
          exit 1

      - name: Dump logs on failure
        if: failure()
        working-directory: testproj
        run: docker compose -f docker-compose.prod.yml logs

      - name: Tear down
        if: always()
        working-directory: testproj
        run: docker compose -f docker-compose.prod.yml down -v
